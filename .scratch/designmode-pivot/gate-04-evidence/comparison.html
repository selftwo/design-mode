<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Phase 1 gate — before/after surfaces</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #eaedf4; color: #171a21; }
    main { max-width: 1320px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.375rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #444a5a; }
    .surface { margin-bottom: 32px; }
    .surface h2 { font-size: 1rem; margin: 0 0 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { margin: 0; background: #fff; border: 1px solid #dce0ea; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(24,30,55,.1); }
    figcaption { padding: 8px 12px; font-size: 12px; color: #565e70; border-bottom: 1px solid #e7eaf1; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Phase 1 re-skin gate — five surfaces</h1>
    <p>Captured at 1280×720. Before = pre-reskin commit dfc3cd4; after = current DLS re-skin.</p>
    
    <section class="surface">
      <h2>Picker</h2>
      <div class="pair">
        <figure><figcaption>Before (dfc3cd4)</figcaption><img src="before/01-picker.png" alt="Picker before" /></figure>
        <figure><figcaption>After (DLS re-skin)</figcaption><img src="after/01-picker.png" alt="Picker after" /></figure>
      </div>
    </section>

    <section class="surface">
      <h2>Board</h2>
      <div class="pair">
        <figure><figcaption>Before (dfc3cd4)</figcaption><img src="before/02-board.png" alt="Board before" /></figure>
        <figure><figcaption>After (DLS re-skin)</figcaption><img src="after/02-board.png" alt="Board after" /></figure>
      </div>
    </section>

    <section class="surface">
      <h2>Annotation editing</h2>
      <div class="pair">
        <figure><figcaption>Before (dfc3cd4)</figcaption><img src="before/03-annotation-editing.png" alt="Annotation editing before" /></figure>
        <figure><figcaption>After (DLS re-skin)</figcaption><img src="after/03-annotation-editing.png" alt="Annotation editing after" /></figure>
      </div>
    </section>

    <section class="surface">
      <h2>Live view</h2>
      <div class="pair">
        <figure><figcaption>Before (dfc3cd4)</figcaption><img src="before/04-live-view.png" alt="Live view before" /></figure>
        <figure><figcaption>After (DLS re-skin)</figcaption><img src="after/04-live-view.png" alt="Live view after" /></figure>
      </div>
    </section>

    <section class="surface">
      <h2>Dispatch</h2>
      <div class="pair">
        <figure><figcaption>Before (dfc3cd4)</figcaption><img src="before/05-dispatch.png" alt="Dispatch before" /></figure>
        <figure><figcaption>After (DLS re-skin)</figcaption><img src="after/05-dispatch.png" alt="Dispatch after" /></figure>
      </div>
    </section>
  </main>
</body>
</html>
